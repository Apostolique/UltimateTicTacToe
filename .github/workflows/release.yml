name: Release to itch.io

on:
  push:
    tags:
    - 'v*'

env:
  ITCH_USER_NAME: apos
  ITCH_GAME_NAME: ultimatetictactoe
  DESKTOP_PATH: Platforms/DesktopGL
  WEB_PATH: Platforms/BlazorGL.KNI

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # The desktop builds target net10.0; the KNI web build targets net8.0.
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Get version from tag
      run: |
        TAGVERSION=$(git describe --tags --abbrev=0)
        echo "TAGVERSION=${TAGVERSION:1}" >> $GITHUB_ENV
    - name: Build Windows
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r win-x64 -c Release --output artifacts/windows --self-contained
    - name: Build Osx
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r osx-x64 -c Release --output artifacts/osx --self-contained
    - name: Build Linux
      run: dotnet publish ${{ env.DESKTOP_PATH }} -r linux-x64 -c Release --output artifacts/linux --self-contained
    - name: Build Web
      run: dotnet publish ${{ env.WEB_PATH }} -c Release --output artifacts/web
    - name: Publish Windows build to itch.io
      uses: josephbmanley/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: windows
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/windows
        VERSION: ${{ env.TAGVERSION }}
    - name: Publish OSX build to itch.io
      uses: josephbmanley/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: osx
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/osx
        VERSION: ${{ env.TAGVERSION }}
    - name: Publish Linux build to itch.io
      uses: josephbmanley/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: linux
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/linux
        VERSION: ${{ env.TAGVERSION }}
    # itch.io marks a build playable in the browser when the channel name says html,
    # and it serves the index.html sitting at the root of the package.
    - name: Publish Web build to itch.io
      uses: josephbmanley/butler-publish-itchio-action@master
      env:
        BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
        CHANNEL: html5
        ITCH_GAME: ${{ env.ITCH_GAME_NAME }}
        ITCH_USER: ${{ env.ITCH_USER_NAME }}
        PACKAGE: artifacts/web/wwwroot
        VERSION: ${{ env.TAGVERSION }}
