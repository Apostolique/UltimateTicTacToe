<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ultimate Tic-Tac-Toe</title>
    <base href="./" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="UltimateTicTacToe.styles.css" rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div id="loading" style="display: table-cell; margin: auto; width:100vw; height:100vh; vertical-align: middle; background: #111827;">
            <div style="display: block; margin: auto; width: 9em; color: white;font-family: 'Segoe UI', sans-serif;">
                <div style="text-align: center; font-size: 0.85em;">Made with<br/><a href="https://github.com/kniEngine/kni"><img src="kni.png" border="0" alt="Kni"></a></div>
                <div style="text-align: center; font-size: 1.8em;">loading&nbsp;<marquee style="width:0.9em; vertical-align: bottom;">.&nbsp;.&nbsp;.&nbsp;&nbsp;&nbsp;</marquee></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <!-- Don't fetch the `.br` copies and decode them here. itch.io unpacks `.br` on the way
         out and Cloudflare gzips whatever it serves, so the bytes arriving are already plain
         and a second decode fails with "Corrupted padding bits". -->
    <script src="_framework/blazor.webassembly.js"></script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.8.0.11.js"></script>

    <script>
        // The backing store is sized in device pixels while the element stays sized in CSS
        // pixels, so the game renders at the screen's real resolution instead of being upscaled
        // from a third of it on a phone. KNI resets the backing store to the CSS size in
        // `UpdateBackBufferSize` on every resize, so this re-asserts each frame rather than
        // running once, and the game re-applies the matching back buffer when it notices.
        //
        // Sizing the canvas rather than zooming the viewport is what makes this survive
        // itch.io: a viewport meta tag only applies to the top level document and the game is
        // served in an iframe, so the tag would be ignored exactly where it's needed.
        //
        // The pointer is untouched by any of it. KNI reports mouse and touch in CSS pixels and
        // scales touch by `DisplayWidth / ClientBounds.Width`, which are both the backing store,
        // so a contact still arrives in the units the layout uses.
        window.utttTarget = { w: 0, h: 0, scale: 1 };

        function utttSizeCanvas()
        {
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            if (!canvas || !holder) return;

            var dpr = window.devicePixelRatio || 1;
            var cssW = holder.clientWidth, cssH = holder.clientHeight;

            // A backgrounded page measures zero. Resizing on that would collapse the back buffer
            // and leave a black screen behind when the tab comes back, so leave it alone and let
            // the next frame after it's visible again do the work.
            if (cssW <= 0 || cssH <= 0) return;

            var bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);

            if (canvas.width !== bw || canvas.height !== bh)
            {
                canvas.width = bw;
                canvas.height = bh;
            }
            // Without an explicit CSS size the element takes its width attribute as CSS pixels,
            // which would blow it up to three times the screen.
            if (canvas.style.width !== cssW + 'px')
            {
                canvas.style.width = cssW + 'px';
                canvas.style.height = cssH + 'px';
            }

            window.utttTarget = { w: bw, h: bh, scale: dpr };
        }

        // KNI drives `Game.IsActive` off the window's focus and blur events, and Apos.Input gates
        // every condition on it, so an inactive game can't report a press. The pointer position
        // isn't gated, which is why this shows up as taps that only ever hover instead of as
        // input dying outright.
        //
        // In an iframe that state sticks: coming back to a backgrounded itch.io page fires no
        // focus event on the frame, so the blur from leaving is never undone. Visibility is the
        // signal that actually tracks this on the web, and a pointer arriving is proof the player
        // is on the game whatever the frame thinks, so the missing focus is synthesized from
        // both. KNI only listens for the event, so dispatching one is enough.
        // Mirrors KNI's own flag rather than asking the browser. `document.hasFocus()` is the
        // wrong question: going fullscreen from the itch.io page leaves the frame's document
        // focused while KNI never saw a focus event, so the game reads inactive and a guard on
        // hasFocus() would decline to fix it. These two listeners see exactly what KNI's do.
        var utttActive = false;
        window.addEventListener('focus', function () { utttActive = true; });
        window.addEventListener('blur', function () { utttActive = false; });

        /// force: dispatch even when the game already reads active. For the rare transitions,
        /// where a redundant activation is cheaper than staying wrong.
        function utttEnsureActive(force)
        {
            if (document.visibilityState === 'hidden') return;
            if (utttActive && !force) return;
            try { window.focus(); } catch (e) { }
            window.dispatchEvent(new Event('focus'));
        }

        document.addEventListener('visibilitychange', function ()
        {
            if (document.visibilityState === 'visible') utttEnsureActive(true);
        });
        window.addEventListener('pageshow', function () { utttEnsureActive(true); });
        // Entering or leaving fullscreen moves focus without telling the frame about it.
        document.addEventListener('fullscreenchange', function () { utttEnsureActive(true); });
        document.addEventListener('webkitfullscreenchange', function () { utttEnsureActive(true); });
        // Capture, so the game is active before KNI's own handler queues the contact. Not forced,
        // so an ordinary tap doesn't raise an activation every time.
        window.addEventListener('touchstart', function () { utttEnsureActive(false); }, true);
        window.addEventListener('mousedown', function () { utttEnsureActive(false); }, true);

        window.utttBackBufferWidth = function () { return window.utttTarget.w; };
        window.utttBackBufferHeight = function () { return window.utttTarget.h; };
        window.utttUiScale = function () { return window.utttTarget.scale; };

        var utttSynced = false;

        function tickJS()
        {
            utttSizeCanvas();
            window.theInstance.invokeMethod('TickDotNet');

            // The game window is built on the first tick, and KNI registers its focus listener
            // with it. This script registered earlier, so any focus event in between was seen
            // here and missed there, which would leave the mirror reading active over a game
            // that isn't. One forced pass settles it.
            if (!utttSynced)
            {
                utttSynced = true;
                utttEnsureActive(true);
            }

            window.requestAnimationFrame(tickJS);
        }

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // Sized before the first tick, so the graphics device reads the real resolution in
            // `PlatformInitialize` rather than starting soft and resetting a frame later.
            utttSizeCanvas();

            // disable context menu on right click
            document.getElementById('theCanvas')
                .addEventListener("contextmenu", e => e.preventDefault());

            // begin game loop
            window.requestAnimationFrame(tickJS);
        };

        window.addEventListener("keydown", function(event)
        {
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
